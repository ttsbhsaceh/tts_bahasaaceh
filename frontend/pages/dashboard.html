<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TTS Aceh</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="app-navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="navbar-brand">
      <i data-lucide="grid-3x3"></i> TTS Aceh
    </a>
    <div class="navbar-actions">
      <span id="username-label" class="username-chip"></span>
      <button id="btn-logout" class="btn btn-outline-danger btn-sm">Keluar</button>
    </div>
  </div>
</nav>

<div class="app-container">

  <div id="guest-banner" class="guest-banner d-none">
    Kamu masuk sebagai <strong>Tamu</strong>. Progres tidak tersimpan permanen — daftar akun untuk menyimpan riwayat belajarmu.
  </div>

  <div class="page-header fade-up">
    <h2>Halo, <span id="welcome-name">...</span> 👋</h2>
    <p>Ringkasan progres belajar Bahasa Aceh kamu.</p>
  </div>

  <div class="stat-grid">
    <div class="stat-card fade-up stagger-1">
      <div class="stat-number" id="stat-total">—</div>
      <div class="stat-label">Total Paket</div>
    </div>
    <div class="stat-card fade-up stagger-2">
      <div class="stat-number" id="stat-selesai">—</div>
      <div class="stat-label">Selesai</div>
    </div>
    <div class="stat-card fade-up stagger-3">
      <div class="stat-number" id="stat-sedang">—</div>
      <div class="stat-label">Sedang Dikerjakan</div>
    </div>
    <div class="stat-card fade-up stagger-4">
      <div class="stat-number" id="stat-belum">—</div>
      <div class="stat-label">Belum Dikerjakan</div>
    </div>
  </div>

  <a href="paket.html" class="btn btn-primary btn-lg fade-up stagger-4" id="btn-mulai">
    <i data-lucide="play"></i> Mulai / Lanjutkan Bermain
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../js/api.js"></script>
<script src="../js/transitions.js"></script>
<script src="../js/dashboard.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
